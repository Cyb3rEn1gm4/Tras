<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>TRON — DISC BATTLE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
"use strict";

const DPR = Math.min(window.devicePixelRatio || 1, 2);
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
let W = 0, H = 0;

function resize(){
  W = window.innerWidth;
  H = window.innerHeight;
  cvs.width  = Math.floor(W * DPR);
  cvs.height = Math.floor(H * DPR);
  cvs.style.width  = W + 'px';
  cvs.style.height = H + 'px';
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------------- COLORS ---------------- */
const CYAN   = '#00e5ff';
const ORANGE = '#ff7a00';
const RED    = '#ff3300';

/* ---------------- STATE ---------------- */
const state = {
  screen: 'menu',          // 'menu' | 'playing' | 'gameover'
  player: {x:0,y:0,vx:0,vy:0,r:15,hp:100,maxHp:100,cd:0,hurt:0},
  enemies: [],
  discs: [],
  particles: [],
  score: 0,
  wave: 0,
  betweenWaves: true,
  waveTimer: 0.8,
  shake: 0,
  t: 0,
  best: +(localStorage.getItem('tron_best') || 0)
};

/* ---------------- INPUT ---------------- */
const input = {
  move: {id:null, ox:0, oy:0, x:0, y:0, active:false},
  aim:  {id:null, x:0, y:0, active:false}
};

function pos(e){
  const r = cvs.getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}

function buzz(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(_){} }

function inRect(x, y, rx, ry, rw, rh){
  return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
}

cvs.addEventListener('pointerdown', e => {
  e.preventDefault();
  const {x, y} = pos(e);

  // МЕНЮ — любой тап запускает игру (кнопка RUN — главный акцент)
  if (state.screen === 'menu'){
    startGame();
    buzz(18);
    return;
  }

  // GAME OVER — любой тап = рестарт
  if (state.screen === 'gameover'){
    startGame();
    buzz(18);
    return;
  }

  // ИГРА
  if (x < W * 0.5) {
    if (input.move.active) return;
    input.move.id = e.pointerId;
    input.move.ox = x; input.move.oy = y;
    input.move.x = x;  input.move.y = y;
    input.move.active = true;
  } else {
    if (input.aim.active) return;
    input.aim.id = e.pointerId;
    input.aim.x = x; input.aim.y = y;
    input.aim.active = true;
  }
}, {passive:false});

window.addEventListener('pointermove', e => {
  if (e.pointerId === input.move.id) {
    const {x,y} = pos(e);
    input.move.x = x; input.move.y = y;
  }
  if (e.pointerId === input.aim.id) {
    const {x,y} = pos(e);
    input.aim.x = x; input.aim.y = y;
  }
}, {passive:false});

function endPointer(e){
  if (e.pointerId === input.move.id) {
    input.move.active = false; input.move.id = null;
  }
  if (e.pointerId === input.aim.id) {
    const {x,y} = pos(e);
    throwDisc(x, y);
    input.aim.active = false; input.aim.id = null;
  }
}
window.addEventListener('pointerup', endPointer, {passive:false});
window.addEventListener('pointercancel', endPointer, {passive:false});

/* ---------------- ACTIONS ---------------- */
function throwDisc(tx, ty){
  const p = state.player;
  if (state.screen !== 'playing' || p.cd > 0) return;
  let dx = tx - p.x, dy = ty - p.y;
  const d = Math.hypot(dx, dy);
  if (d < 4) return;
  dx /= d; dy /= d;
  const sp = 780;
  state.discs.push({
    x: p.x + dx * p.r, y: p.y + dy * p.r,
    vx: dx * sp, vy: dy * sp,
    r: 9, owner: 'player', life: 3.2, trail: []
  });
  p.cd = 0.32;
  buzz(12);
}

function burst(x, y, color, n, power){
  power = power || 300;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = 60 + Math.random() * power;
    state.particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,
      life: 0.5 + Math.random() * 0.35,
      max: 0.85,
      color,
      size: 1.5 + Math.random() * 3
    });
  }
}

/* ---------------- WAVES ---------------- */
function spawnWave(){
  const n = Math.min(1 + Math.floor(state.wave / 2), 5);
  const p = state.player;
  for (let i = 0; i < n; i++){
    let x = 0, y = 0, tries = 0;
    do {
      const side = Math.floor(Math.random() * 4);
      if (side === 0){ x = 60 + Math.random() * (W - 120); y = 70; }
      else if (side === 1){ x = W - 70; y = 60 + Math.random() * (H - 120); }
      else if (side === 2){ x = 60 + Math.random() * (W - 120); y = H - 70; }
      else { x = 70; y = 60 + Math.random() * (H - 120); }
      tries++;
    } while (Math.hypot(x - p.x, y - p.y) < 220 && tries < 20);

    state.enemies.push({
      x, y, r: 14,
      hp: 100, maxHp: 100,
      cd: 0.9 + Math.random() * 1.2,
      hurt: 0,
      speed: 72 + state.wave * 7,
      strafeDir: Math.random() < 0.5 ? 1 : -1
    });
  }
}

/* ---------------- START / RESET ---------------- */
function reset(){
  const p = state.player;
  p.x = W / 2;
  p.y = H * 0.72;
  p.vx = p.vy = 0;
  p.hp = p.maxHp;
  p.cd = 0;
  p.hurt = 0;

  state.enemies.length = 0;
  state.discs.length = 0;
  state.particles.length = 0;
  state.score = 0;
  state.wave = 0;
  state.betweenWaves = true;
  state.waveTimer = 0.8;
  state.shake = 0;

  input.move.active = false; input.move.id = null;
  input.aim.active = false;  input.aim.id = null;
}

function startGame(){
  reset();
  state.screen = 'playing';
}

/* ---------------- UPDATE ---------------- */
function update(dt){
  state.t += dt;
  state.shake *= Math.pow(0.001, dt);
  if (state.shake < 0.3) state.shake = 0;

  // частицы и тряска живут всегда (для красоты меню/гейм-овера)
  for (let i = state.particles.length - 1; i >= 0; i--){
    const pt = state.particles[i];
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.vx *= Math.pow(0.08, dt);
    pt.vy *= Math.pow(0.08, dt);
    pt.life -= dt;
    if (pt.life <= 0) state.particles.splice(i, 1);
  }

  if (state.screen !== 'playing') return;

  const p = state.player;

  /* ---- player movement ---- */
  let mvx = 0, mvy = 0;
  if (input.move.active){
    const dx = input.move.x - input.move.ox;
    const dy = input.move.y - input.move.oy;
    const d = Math.hypot(dx, dy);
    if (d > 7){
      const m = Math.min(d / 65, 1);
      mvx = (dx / d) * m;
      mvy = (dy / d) * m;
    }
  }
  const SPD = 340;
  const lerp = Math.min(1, dt * 15);
  p.vx += (mvx * SPD - p.vx) * lerp;
  p.vy += (mvy * SPD - p.vy) * lerp;
  p.x += p.vx * dt;
  p.y += p.vy * dt;

  if (p.x < p.r){ p.x = p.r; p.vx = 0; }
  if (p.x > W - p.r){ p.x = W - p.r; p.vx = 0; }
  if (p.y < p.r){ p.y = p.r; p.vy = 0; }
  if (p.y > H - p.r){ p.y = H - p.r; p.vy = 0; }

  p.cd -= dt;
  p.hurt = Math.max(0, p.hurt - dt * 3);

  /* ---- discs ---- */
  for (let i = state.discs.length - 1; i >= 0; i--){
    const d = state.discs[i];

    d.trail.push({x: d.x, y: d.y});
    if (d.trail.length > 9) d.trail.shift();

    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.life -= dt;

    if (d.x < d.r){ d.x = d.r; d.vx = Math.abs(d.vx); }
    if (d.x > W - d.r){ d.x = W - d.r; d.vx = -Math.abs(d.vx); }
    if (d.y < d.r){ d.y = d.r; d.vy = Math.abs(d.vy); }
    if (d.y > H - d.r){ d.y = H - d.r; d.vy = -Math.abs(d.vy); }

    if (d.life <= 0){ state.discs.splice(i, 1); continue; }

    if (d.owner === 'player'){
      let hit = false;
      for (let j = state.enemies.length - 1; j >= 0; j--){
        const e = state.enemies[j];
        if (Math.hypot(d.x - e.x, d.y - e.y) < d.r + e.r){
          e.hp -= 34;
          e.hurt = 1;
          state.score += 10;
          state.shake = Math.max(state.shake, 7);
          burst(d.x, d.y, CYAN, 16, 340);
          buzz(22);
          hit = true;

          if (e.hp <= 0){
            burst(e.x, e.y, ORANGE, 34, 460);
            state.enemies.splice(j, 1);
            state.score += 100;
            state.shake = Math.max(state.shake, 14);
            buzz([20, 40, 30]);
          }
          break;
        }
      }
      if (hit) state.discs.splice(i, 1);
    } else {
      if (Math.hypot(d.x - p.x, d.y - p.y) < d.r + p.r){
        p.hp -= 12;
        p.hurt = 1;
        state.shake = Math.max(state.shake, 11);
        burst(d.x, d.y, RED, 18, 320);
        buzz(45);
        state.discs.splice(i, 1);

        if (p.hp <= 0){
          p.hp = 0;
          state.screen = 'gameover';
          state.shake = 26;
          burst(p.x, p.y, CYAN, 60, 520);
          if (state.score > state.best){
            state.best = state.score;
            localStorage.setItem('tron_best', String(state.best));
          }
        }
      }
    }
  }

  /* ---- enemies ---- */
  for (const e of state.enemies){
    e.hurt = Math.max(0, e.hurt - dt * 3);
    e.cd -= dt;

    const dx = p.x - e.x, dy = p.y - e.y;
    const dist = Math.hypot(dx, dy) || 1;
    const nx = dx / dist, ny = dy / dist;
    const sp = e.speed;

    if (dist > 250){
      e.x += nx * sp * dt;
      e.y += ny * sp * dt;
    } else if (dist < 165){
      e.x -= nx * sp * dt;
      e.y -= ny * sp * dt;
    } else {
      e.x += -ny * sp * dt * 0.8 * e.strafeDir;
      e.y += nx * sp * dt * 0.8 * e.strafeDir;
    }

    if (e.x < e.r) e.x = e.r;
    if (e.x > W - e.r) e.x = W - e.r;
    if (e.y < e.r) e.y = e.r;
    if (e.y > H - e.r) e.y = H - e.r;

    if (e.cd <= 0 && dist < 620){
      const err = 0.14;
      const a = Math.atan2(ny, nx) + (Math.random() - 0.5) * err * 2;
      const dsp = 470 + state.wave * 10;
      state.discs.push({
        x: e.x + Math.cos(a) * (e.r + 2),
        y: e.y + Math.sin(a) * (e.r + 2),
        vx: Math.cos(a) * dsp,
        vy: Math.sin(a) * dsp,
        r: 9, owner: 'enemy', life: 3.2, trail: []
      });
      e.cd = Math.max(0.75, 1.45 - state.wave * 0.05) + Math.random() * 0.8;
    }
  }

  /* ---- waves ---- */
  if (state.enemies.length === 0 && !state.betweenWaves){
    state.betweenWaves = true;
    state.waveTimer = 1.4;
  }
  if (state.betweenWaves){
    state.waveTimer -= dt;
    if (state.waveTimer <= 0){
      state.betweenWaves = false;
      state.wave++;
      spawnWave();
    }
  }
}

/* ---------------- RENDER HELPERS ---------------- */
function roundRect(x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawGrid(){
  const gs = 58;
  const off = (state.t * 14) % gs;
  ctx.strokeStyle = 'rgba(0,140,190,0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = -off; x < W + gs; x += gs){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = -off; y < H + gs; y += gs){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  const g = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W,H)*0.7);
  g.addColorStop(0, 'rgba(0,80,120,0.10)');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawArena(){
  ctx.strokeStyle = CYAN;
  ctx.shadowBlur = 22;
  ctx.shadowColor = CYAN;
  ctx.lineWidth = 2.5;
  ctx.strokeRect(2, 2, W - 4, H - 4);
  ctx.shadowBlur = 0;
}

function drawPlayer(){
  const p = state.player;
  const col = p.hurt > 0 ? '#ffffff' : CYAN;

  ctx.shadowBlur = 28;
  ctx.shadowColor = CYAN;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#001820';
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 2;
  ctx.globalAlpha = 0.55 + 0.25 * Math.sin(state.t * 6);
  ctx.beginPath(); ctx.arc(p.x, p.y, p.r + 7, 0, Math.PI * 2); ctx.stroke();
  ctx.globalAlpha = 1;

  if (p.cd > 0){
    ctx.strokeStyle = 'rgba(0,229,255,0.7)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r + 12, -Math.PI/2, -Math.PI/2 + (p.cd / 0.32) * Math.PI * 2);
    ctx.stroke();
  }
}

function drawEnemy(e){
  const col = e.hurt > 0 ? '#ffffff' : ORANGE;

  ctx.shadowBlur = 22;
  ctx.shadowColor = ORANGE;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#201000';
  ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 0.45, 0, Math.PI * 2); ctx.fill();

  const w = 32;
  const hx = e.x - w / 2, hy = e.y - e.r - 14;
  ctx.fillStyle = 'rgba(255,120,0,0.25)';
  ctx.fillRect(hx, hy, w, 4);
  ctx.fillStyle = ORANGE;
  ctx.fillRect(hx, hy, w * Math.max(0, e.hp) / e.maxHp, 4);
}

function drawDisc(d){
  const col = d.owner === 'player' ? CYAN : RED;

  for (let i = 0; i < d.trail.length; i++){
    const t = d.trail[i];
    const k = i / d.trail.length;
    ctx.globalAlpha = k * 0.45;
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(t.x, t.y, d.r * k * 0.95, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.shadowBlur = 26;
  ctx.shadowColor = col;
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(d.x, d.y, d.r * 0.36, 0, Math.PI * 2); ctx.fill();
}

function drawParticles(){
  for (const pt of state.particles){
    const k = Math.max(0, pt.life / pt.max);
    ctx.globalAlpha = k;
    ctx.fillStyle = pt.color;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, pt.size * k, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawControls(){
  const p = state.player;

  if (input.move.active){
    ctx.strokeStyle = 'rgba(0,229,255,0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(input.move.ox, input.move.oy, 52, 0, Math.PI * 2); ctx.stroke();

    let dx = input.move.x - input.move.ox;
    let dy = input.move.y - input.move.oy;
    const d = Math.hypot(dx, dy);
    if (d > 52){ dx = dx / d * 52; dy = dy / d * 52; }

    ctx.fillStyle = 'rgba(0,229,255,0.35)';
    ctx.shadowBlur = 18; ctx.shadowColor = CYAN;
    ctx.beginPath(); ctx.arc(input.move.ox + dx, input.move.oy + dy, 24, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (input.aim.active){
    ctx.strokeStyle = 'rgba(0,229,255,0.55)';
    ctx.lineWidth = 2;
    ctx.setLineDash([7, 7]);
    ctx.lineDashOffset = -state.t * 40;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(input.aim.x, input.aim.y);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.strokeStyle = CYAN;
    ctx.shadowBlur = 15; ctx.shadowColor = CYAN;
    ctx.beginPath(); ctx.arc(input.aim.x, input.aim.y, 13, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(input.aim.x, input.aim.y, 3, 0, Math.PI * 2); ctx.fillStyle = CYAN; ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function drawUI(){
  const p = state.player;
  const bw = Math.min(W * 0.42, 210), bh = 13;
  const x0 = 16, y0 = 16;

  ctx.fillStyle = 'rgba(0,229,255,0.15)';
  ctx.fillRect(x0, y0, bw, bh);

  ctx.fillStyle = p.hurt > 0 ? '#fff' : CYAN;
  ctx.shadowBlur = 16; ctx.shadowColor = CYAN;
  ctx.fillRect(x0, y0, bw * Math.max(0, p.hp) / p.maxHp, bh);
  ctx.shadowBlur = 0;

  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(x0, y0, bw, bh);

  ctx.fillStyle = CYAN;
  ctx.font = 'bold 13px monospace';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'top';
  ctx.fillText('HP ' + Math.ceil(p.hp), x0 + 4, y0 + bh + 6);

  ctx.textAlign = 'right';
  ctx.font = 'bold 17px monospace';
  ctx.shadowBlur = 12; ctx.shadowColor = CYAN;
  ctx.fillText('SCORE ' + state.score, W - 16, 16);
  ctx.font = 'bold 15px monospace';
  ctx.fillText('WAVE ' + Math.max(1, state.wave), W - 16, 40);
  ctx.shadowBlur = 0;

  if (state.betweenWaves && state.wave > 0){
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,229,255,' + (0.4 + 0.4 * Math.sin(state.t * 8)) + ')';
    ctx.font = 'bold 26px monospace';
    ctx.shadowBlur = 25; ctx.shadowColor = CYAN;
    ctx.fillText('WAVE ' + (state.wave + 1), W / 2, H * 0.42);
    ctx.shadowBlur = 0;
  }
}

/* ---------------- MENU SCREEN ---------------- */
function drawMenu(){
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Заголовок
  const titleSize = Math.min(64, W * 0.17);
  ctx.font = 'bold ' + titleSize + 'px monospace';
  ctx.fillStyle = CYAN;
  ctx.shadowBlur = 40; ctx.shadowColor = CYAN;
  ctx.fillText('TRON', W / 2, H * 0.24);
  ctx.shadowBlur = 0;

  ctx.font = 'bold ' + Math.min(16, W * 0.042) + 'px monospace';
  ctx.fillStyle = 'rgba(0,229,255,0.75)';
  ctx.fillText('D I S C   B A T T L E', W / 2, H * 0.24 + titleSize * 0.8);

  // Вращающийся диск
  const cx = W / 2, cy = H * 0.42, rr = Math.min(28, W * 0.07);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(state.t * 1.6);
  ctx.shadowBlur = 30; ctx.shadowColor = CYAN;
  ctx.fillStyle = CYAN;
  ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(0, 0, rr * 0.38, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = CYAN;
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(0, 0, rr + 10, 0, Math.PI * 1.4); ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 0;

  // КНОПКА RUN
  const bw = Math.min(W * 0.66, 320);
  const bh = 82;
  const bx = (W - bw) / 2;
  const by = H * 0.58;

  const pulse = 0.5 + 0.5 * Math.sin(state.t * 3.2);

  // внешнее свечение
  ctx.shadowBlur = 30 + 25 * pulse;
  ctx.shadowColor = CYAN;

  // градиент кнопки
  const grd = ctx.createLinearGradient(bx, by, bx, by + bh);
  grd.addColorStop(0, 'rgba(0,229,255,' + (0.28 + 0.18 * pulse) + ')');
  grd.addColorStop(1, 'rgba(0,120,170,' + (0.30 + 0.15 * pulse) + ')');
  ctx.fillStyle = grd;
  roundRect(bx, by, bw, bh, 18);
  ctx.fill();

  // рамка
  ctx.lineWidth = 3;
  ctx.strokeStyle = CYAN;
  ctx.stroke();
  ctx.shadowBlur = 0;

  // текст RUN
  ctx.fillStyle = '#eaffff';
  ctx.font = 'bold 40px monospace';
  ctx.shadowBlur = 22; ctx.shadowColor = CYAN;
  ctx.fillText('RUN', W / 2, by + bh / 2 - 1);
  ctx.shadowBlur = 0;

  // треугольник ▶
  ctx.fillStyle = CYAN;
  ctx.beginPath();
  const tx = bx + bw - 44, ty = by + bh / 2;
  ctx.moveTo(tx, ty - 12);
  ctx.lineTo(tx + 18, ty);
  ctx.lineTo(tx, ty + 12);
  ctx.closePath();
  ctx.fill();

  // подсказка управления
  ctx.fillStyle = 'rgba(0,229,255,0.55)';
  ctx.font = '13px monospace';
  ctx.fillText('СЛЕВА — ДВИЖЕНИЕ', W / 2, H * 0.80);
  ctx.fillText('СПРАВА — ПРИЦЕЛ И БРОСОК', W / 2, H * 0.80 + 20);

  // рекорд
  if (state.best > 0){
    ctx.fillStyle = 'rgba(0,229,255,0.45)';
    ctx.font = 'bold 13px monospace';
    ctx.fillText('BEST: ' + state.best, W / 2, H - 32);
  }

  // мерцающая подсказка
  ctx.globalAlpha = 0.4 + 0.4 * Math.sin(state.t * 4);
  ctx.fillStyle = 'rgba(0,229,255,0.6)';
  ctx.font = '11px monospace';
  ctx.fillText('нажми кнопку, чтобы начать', W / 2, by + bh + 26);
  ctx.globalAlpha = 1;
}

/* ---------------- GAME OVER ---------------- */
function drawGameOver(){
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  ctx.fillStyle = CYAN;
  ctx.shadowBlur = 35; ctx.shadowColor = CYAN;
  ctx.font = 'bold ' + Math.min(46, W * 0.11) + 'px monospace';
  ctx.fillText('DEREZZED', W / 2, H * 0.32);
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#9ff';
  ctx.font = 'bold 22px monospace';
  ctx.fillText('SCORE: ' + state.score, W / 2, H * 0.42);

  ctx.fillStyle = 'rgba(0,229,255,0.7)';
  ctx.font = '16px monospace';
  ctx.fillText('BEST: ' + state.best, W / 2, H * 0.47);

  // кнопка RUN AGAIN
  const bw = Math.min(W * 0.66, 320);
  const bh = 74;
  const bx = (W - bw) / 2;
  const by = H * 0.58;
  const pulse = 0.5 + 0.5 * Math.sin(state.t * 3.2);

  ctx.shadowBlur = 28 + 22 * pulse;
  ctx.shadowColor = CYAN;
  const grd = ctx.createLinearGradient(bx, by, bx, by + bh);
  grd.addColorStop(0, 'rgba(0,229,255,' + (0.26 + 0.16 * pulse) + ')');
  grd.addColorStop(1, 'rgba(0,120,170,' + (0.28 + 0.14 * pulse) + ')');
  ctx.fillStyle = grd;
  roundRect(bx, by, bw, bh, 18);
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = CYAN;
  ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.fillStyle = '#eaffff';
  ctx.font = 'bold 26px monospace';
  ctx.shadowBlur = 20; ctx.shadowColor = CYAN;
  ctx.fillText('RUN AGAIN', W / 2, by + bh / 2);
  ctx.shadowBlur = 0;

  ctx.globalAlpha = 0.4 + 0.4 * Math.sin(state.t * 4);
  ctx.fillStyle = 'rgba(0,229,255,0.6)';
  ctx.font = '11px monospace';
  ctx.fillText('нажми в любом месте', W / 2, by + bh + 24);
  ctx.globalAlpha = 1;
}

/* ---------------- RENDER ---------------- */
function render(){
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#000308';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (state.shake > 0){
    ctx.translate(
      (Math.random() - 0.5) * state.shake,
      (Math.random() - 0.5) * state.shake
    );
  }

  drawGrid();
  drawArena();
  drawParticles();

  if (state.screen === 'playing' || state.screen === 'gameover'){
    for (const d of state.discs) drawDisc(d);
    for (const e of state.enemies) drawEnemy(e);
    if (state.screen === 'playing'){
      drawPlayer();
      drawControls();
    }
  }

  ctx.restore();

  if (state.screen === 'playing'){
    drawUI();
  } else if (state.screen === 'menu'){
    drawMenu();
  } else if (state.screen === 'gameover'){
    drawGameOver();
  }
}

/* ---------------- LOOP ---------------- */
let last = performance.now();
function loop(now){
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ---------------- BOOT ---------------- */
state.screen = 'menu';
reset();
requestAnimationFrame(loop);

// блокируем зум/скролл на iOS
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});

})();
</script>
</body>
