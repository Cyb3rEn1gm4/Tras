<!DOCTYPE html>
<html lang="ru">
<head>

<title>TRON // ARENA</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:"Courier New",monospace;touch-action:none;}
  #c{position:fixed;inset:0;display:block;width:100%;height:100%;}

  /* ─── Оверлеи ─── */
  #vignette{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at center,transparent 35%,rgba(0,0,0,.75) 100%);}
  #scanlines{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.055;
    background:repeating-linear-gradient(to bottom,#000 0px,#000 1px,transparent 1px,transparent 3px);}
  #hurtFlash{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:0;
    background:radial-gradient(ellipse at center,transparent 25%,rgba(255,40,0,.65) 100%);
    transition:opacity .18s;}
  #hurtFlash.on{opacity:1;}

  /* ─── HUD ─── */
  #hud{position:fixed;inset:0;pointer-events:none;padding:16px;z-index:5;
    display:flex;justify-content:space-between;align-items:flex-start;}
  .hpwrap{width:min(42vw,210px);}
  .hpbar{height:11px;border:1px solid #00e5ff;border-radius:3px;
    background:rgba(0,229,255,.08);overflow:hidden;
    box-shadow:0 0 16px rgba(0,229,255,.5),inset 0 0 12px rgba(0,229,255,.15);}
  .hpfill{height:100%;width:100%;background:linear-gradient(90deg,#0090c0,#00e5ff 60%,#aaffff);
    box-shadow:0 0 14px #00e5ff;transition:width .12s linear;}
  .hplabel{color:#00e5ff;font-size:11px;letter-spacing:3px;margin-top:6px;
    text-shadow:0 0 10px #00e5ff;font-weight:bold;}
  .stats{text-align:right;color:#00e5ff;font-weight:bold;letter-spacing:2px;
    text-shadow:0 0 14px #00e5ff;font-size:14px;line-height:1.5;}
  .stats .sc{font-size:22px;}
  .combo{color:#ffcc00;font-size:12px;letter-spacing:3px;opacity:0;
    transition:opacity .2s;text-shadow:0 0 14px #ffcc00;}
  .combo.on{opacity:1;}

  .waveMsg{position:fixed;left:0;right:0;top:34%;text-align:center;
    color:#00e5ff;font-size:34px;font-weight:bold;letter-spacing:10px;
    text-shadow:0 0 30px #00e5ff,0 0 60px #0077aa;pointer-events:none;
    opacity:0;transform:scale(.85);transition:opacity .3s,transform .3s;z-index:4;}
  .waveMsg.show{opacity:1;transform:scale(1);}

  /* ─── Экраны ─── */
  .screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:auto;
    background:radial-gradient(ellipse at center,rgba(0,25,45,.35),rgba(0,0,0,.88));
    animation:fade .4s ease;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .hidden{display:none!important;}

  .title{font-size:min(17vw,84px);font-weight:bold;letter-spacing:min(3vw,16px);
    color:#eaffff;text-shadow:0 0 20px #00e5ff,0 0 55px #00e5ff,0 0 100px #0077aa;
    margin-left:min(3vw,16px);line-height:1;}
  .subtitle{font-size:min(4.5vw,18px);letter-spacing:min(1.8vw,10px);
    color:#7fe9ff;margin-top:16px;text-shadow:0 0 16px #00a6cc;
    font-weight:bold;margin-bottom:min(8vh,64px);}

  .btn{pointer-events:auto;cursor:pointer;position:relative;
    border:2px solid #00e5ff;border-radius:14px;
    background:linear-gradient(180deg,rgba(0,229,255,.24),rgba(0,120,170,.10));
    color:#eaffff;font-family:inherit;font-weight:bold;
    font-size:min(9vw,36px);letter-spacing:min(2vw,7px);
    padding:18px 48px;margin-left:min(2vw,7px);
    text-shadow:0 0 20px #00e5ff;
    animation:pulse 1.9s ease-in-out infinite;
    -webkit-appearance:none;appearance:none;outline:none;}
  @keyframes pulse{
    0%,100%{box-shadow:0 0 28px rgba(0,229,255,.5),inset 0 0 22px rgba(0,229,255,.22);transform:scale(1);}
    50%{box-shadow:0 0 70px rgba(0,229,255,.95),inset 0 0 44px rgba(0,229,255,.5);transform:scale(1.045);}
  }
  .btn:active{transform:scale(.96);}

  .hint{position:absolute;bottom:9%;left:0;right:0;text-align:center;
    color:rgba(0,229,255,.5);font-size:12px;letter-spacing:2px;line-height:2.1;}
  .best{position:absolute;bottom:3.5%;left:0;right:0;text-align:center;
    color:rgba(0,229,255,.38);font-size:12px;letter-spacing:3px;font-weight:bold;}

  .goTitle{font-size:min(12vw,54px);font-weight:bold;letter-spacing:min(2vw,10px);
    color:#00e5ff;text-shadow:0 0 25px #00e5ff,0 0 70px #00e5ff;margin-left:min(2vw,10px);}
  .goScore{font-size:min(7vw,28px);color:#c8f8ff;margin-top:24px;letter-spacing:5px;
    text-shadow:0 0 20px #00a6cc;}
  .goBest{font-size:min(4.2vw,15px);color:rgba(0,229,255,.65);margin-top:10px;
    letter-spacing:3px;margin-bottom:min(8vh,60px);}

  #loadErr{position:fixed;inset:0;z-index:99;display:none;flex-direction:column;
    align-items:center;justify-content:center;background:#000;color:#ff7a00;
    font-size:15px;text-align:center;padding:30px;line-height:1.9;letter-spacing:1px;}

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

window.__ok = true;

/* ══════════════════ БАЗА ══════════════════ */
const canvas = document.getElementById('c');
let W = innerWidth, H = innerHeight;

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(W, H, false);
renderer.setClearColor(0x000005, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000812, 0.012);

const camera = new THREE.PerspectiveCamera(58, W/H, 0.1, 500);
camera.position.set(0, 40, 18);
camera.lookAt(0, 0, 0);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(W, H), 1.35, 0.55, 0.15);
composer.addPass(bloom);

const COL_CYAN   = 0x00e5ff;
const COL_ORANGE = 0xff7a00;
const COL_RED    = 0xff2200;
const COL_GOLD   = 0xffcc00;

const ARENA_R = 14;

/* ══════════════════ ЗВУК ══════════════════ */
const SFX = {
  ctx:null, master:null, drone:null,
  init(){
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.25;
      this.master.connect(this.ctx.destination);
    } catch(e){}
  },
  _tone(freq, dur, type, vol, slideTo){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(this.master);
    osc.start(t); osc.stop(t + dur);
  },
  throw(){ this._tone(880, 0.09, 'square', 0.14, 440); },
  hit(){ this._tone(300, 0.11, 'sawtooth', 0.18, 140); },
  explode(){
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    const buf = this.ctx.createBuffer(1, this.ctx.sampleRate*0.35, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2.2);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(2400, t);
    flt.frequency.exponentialRampToValueAtTime(180, t+0.35);
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.35, t);
    g.gain.exponentialRampToValueAtTime(0.001, t+0.35);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t);
  },
  hurt(){ this._tone(180, 0.15, 'sawtooth', 0.22, 80); },
  startDrone(){
    if (!this.ctx || this.drone) return;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine'; osc.frequency.value = 55;
    g.gain.value = 0.04;
    osc.connect(g); g.connect(this.master);
    osc.start();
    this.drone = {osc, g};
  },
  stopDrone(){
    if (!this.drone) return;
    try {
      this.drone.g.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.4);
      this.drone.osc.stop(this.ctx.currentTime + 0.4);
    } catch(e){}
    this.drone = null;
  }
};

/* ══════════════════ ОКРУЖЕНИЕ — ГОРОД ══════════════════ */
function buildCity(){
  const N = 90;
  const fillGeo = new THREE.BoxGeometry(1,1,1);
  const fillMat = new THREE.MeshBasicMaterial({color:0x010710});
  const fill = new THREE.InstancedMesh(fillGeo, fillMat, N);

  const edgeVerts = new THREE.EdgesGeometry(fillGeo).attributes.position.array;
  const edgePositions = [];
  const dummy = new THREE.Object3D();

  for (let i = 0; i < N; i++){
    const angle = Math.random()*Math.PI*2;
    const radius = 38 + Math.random()*120;
    const x = Math.cos(angle)*radius;
    const z = Math.sin(angle)*radius;
    const h = 14 + Math.random()*80;
    const w = 3 + Math.random()*7;
    const d = 3 + Math.random()*7;

    dummy.position.set(x, h/2 - 3, z);
    dummy.scale.set(w, h, d);
    dummy.rotation.set(0, angle, 0);
    dummy.updateMatrix();
    fill.setMatrixAt(i, dummy.matrix);

    for (let j = 0; j < edgeVerts.length; j += 3){
      const v = new THREE.Vector3(edgeVerts[j], edgeVerts[j+1], edgeVerts[j+2]);
      v.applyMatrix4(dummy.matrix);
      edgePositions.push(v.x, v.y, v.z);
    }
  }
  fill.instanceMatrix.needsUpdate = true;
  scene.add(fill);

  const edgeGeo = new THREE.BufferGeometry();
  edgeGeo.setAttribute('position', new THREE.Float32BufferAttribute(edgePositions, 3));
  scene.add(new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color:0x0090c0, transparent:true, opacity:0.35,
    blending:THREE.AdditiveBlending, depthWrite:false
  })));
}
buildCity();

/* далёкая луна */
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(4.5, 20, 16),
  new THREE.MeshBasicMaterial({color:0x0088bb})
);
moon.position.set(-70, 95, -140);
scene.add(moon);

const moonHalo = new THREE.Mesh(
  new THREE.SphereGeometry(9, 20, 16),
  new THREE.MeshBasicMaterial({color:0x004466, transparent:true, opacity:0.25,
    blending:THREE.AdditiveBlending, depthWrite:false})
);
moonHalo.position.copy(moon.position);
scene.add(moonHalo);

/* ══════════════════ АМБИЕНТНЫЕ ЧАСТИЦЫ ══════════════════ */
const AMB_N = 300;
const ambGeo = new THREE.BufferGeometry();
const ambPos = new Float32Array(AMB_N*3);
const ambVel = new Float32Array(AMB_N*3);
for (let i = 0; i < AMB_N; i++){
  const a = Math.random()*Math.PI*2;
  const r = Math.random()*50;
  ambPos[i*3]   = Math.cos(a)*r;
  ambPos[i*3+1] = Math.random()*18;
  ambPos[i*3+2] = Math.sin(a)*r;
  ambVel[i*3]   = (Math.random()-0.5)*0.4;
  ambVel[i*3+1] = 0.15 + Math.random()*0.5;
  ambVel[i*3+2] = (Math.random()-0.5)*0.4;
}
ambGeo.setAttribute('position', new THREE.BufferAttribute(ambPos, 3));
const ambient = new THREE.Points(ambGeo, new THREE.PointsMaterial({
  color:0x00aadd, size:0.18, transparent:true, opacity:0.55,
  blending:THREE.AdditiveBlending, depthWrite:false, sizeAttenuation:true
}));
scene.add(ambient);

function updateAmbient(dt){
  const p = ambGeo.attributes.position.array;
  for (let i = 0; i < AMB_N; i++){
    p[i*3]   += ambVel[i*3]   * dt;
    p[i*3+1] += ambVel[i*3+1] * dt;
    p[i*3+2] += ambVel[i*3+2] * dt;
    if (p[i*3+1] > 20){
      p[i*3]   = (Math.random()-0.5)*80;
      p[i*3+1] = 0;
      p[i*3+2] = (Math.random()-0.5)*80;
    }
  }
  ambGeo.attributes.position.needsUpdate = true;
}

/* ══════════════════ АРЕНА ══════════════════ */
function makeFloorTexture(){
  const S = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#01060f';
  g.fillRect(0,0,S,S);

  const cx = S/2, cy = S/2;
  const rg = g.createRadialGradient(cx,cy,0,cx,cy,S/2);
  rg.addColorStop(0, 'rgba(0,90,130,0.55)');
  rg.addColorStop(0.4, 'rgba(0,50,90,0.25)');
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg;
  g.fillRect(0,0,S,S);

  g.strokeStyle = 'rgba(0,190,230,0.55)';
  g.lineWidth = 2.5;
  for (let r = 50; r < S/2 - 12; r += 44){
    g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.stroke();
  }

  g.lineWidth = 1.4;
  g.strokeStyle = 'rgba(0,180,220,0.28)';
  for (let i = 0; i < 32; i++){
    const a = i/32*Math.PI*2;
    g.beginPath();
    g.moveTo(cx + Math.cos(a)*120, cy + Math.sin(a)*120);
    g.lineTo(cx + Math.cos(a)*(S/2 - 22), cy + Math.sin(a)*(S/2 - 22));
    g.stroke();
  }

  g.strokeStyle = 'rgba(140,255,255,0.9)';
  g.lineWidth = 5;
  g.beginPath(); g.arc(cx,cy,S/2 - 8,0,Math.PI*2); g.stroke();

  const t = new THREE.CanvasTexture(c);
  t.anisotropy = 4;
  return t;
}

const floorTex = makeFloorTexture();
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(ARENA_R, 96),
  new THREE.MeshBasicMaterial({map:floorTex, transparent:false})
);
floor.rotation.x = -Math.PI/2;
floor.position.y = 0;
scene.add(floor);

/* rim */
const rim = new THREE.Mesh(
  new THREE.TorusGeometry(ARENA_R, 0.10, 8, 128),
  new THREE.MeshBasicMaterial({color:COL_CYAN})
);
rim.rotation.x = -Math.PI/2;
rim.position.y = 0.06;
scene.add(rim);

/* energy barrier */
const barrier = new THREE.Mesh(
  new THREE.CylinderGeometry(ARENA_R + 0.1, ARENA_R + 0.1, 3.2, 128, 1, true),
  new THREE.MeshBasicMaterial({
    color:COL_CYAN, transparent:true, opacity:0.05,
    side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false
  })
);
barrier.position.y = 1.6;
scene.add(barrier);

/* верхнее кольцо */
const topRing = new THREE.Mesh(
  new THREE.TorusGeometry(ARENA_R + 0.1, 0.05, 8, 128),
  new THREE.MeshBasicMaterial({color:COL_CYAN, transparent:true, opacity:0.6,
    blending:THREE.AdditiveBlending, depthWrite:false})
);
topRing.rotation.x = -Math.PI/2;
topRing.position.y = 3.2;
scene.add(topRing);

/* ══════════════════ ЧАСТИЦЫ ВЗРЫВОВ ══════════════════ */
const MAXP = 1600;
const parts = [];
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAXP*3);
const pCol = new Float32Array(MAXP*3);
const pSiz = new Float32Array(MAXP);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('pcolor',   new THREE.BufferAttribute(pCol, 3));
pGeo.setAttribute('psize',    new THREE.BufferAttribute(pSiz, 1));
pGeo.setDrawRange(0, 0);

const pMat = new THREE.ShaderMaterial({
  vertexShader:`attribute vec3 pcolor;attribute float psize;varying vec3 vColor;
    void main(){vColor=pcolor;vec4 mv=modelViewMatrix*vec4(position,1.0);
    gl_PointSize=psize*(260.0/-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying vec3 vColor;void main(){vec2 c=gl_PointCoord-0.5;
    float d=length(c);if(d>0.5)discard;float a=smoothstep(0.5,0.0,d);
    gl_FragColor=vec4(vColor*a,a);}`,
  transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
});
const pPoints = new THREE.Points(pGeo, pMat);
pPoints.frustumCulled = false;
scene.add(pPoints);

function spawnBurst(x,y,z, color, count, speed){
  const col = new THREE.Color(color);
  for (let i = 0; i < count; i++){
    if (parts.length >= MAXP) return;
    const a = Math.random()*Math.PI*2;
    const e = (Math.random()-0.5)*Math.PI;
    const s = speed*(0.25 + Math.random()*0.75);
    parts.push({
      x,y,z,
      vx:Math.cos(a)*Math.cos(e)*s,
      vy:Math.sin(e)*s*0.85 + 2,
      vz:Math.sin(a)*Math.cos(e)*s,
      life:0.45 + Math.random()*0.5,
      max:0.95,
      size:0.45 + Math.random()*0.75,
      r:col.r, g:col.g, b:col.b
    });
  }
}

function updateParticles(dt){
  for (let i = parts.length-1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt;
    if (p.life <= 0){ parts.splice(i,1); continue; }
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    p.vy -= 4.5*dt;
    const damp = Math.pow(0.05, dt);
    p.vx *= damp; p.vy *= damp; p.vz *= damp;
  }
  const n = Math.min(parts.length, MAXP);
  for (let i = 0; i < n; i++){
    const p = parts[i];
    const k = p.life / p.max;
    pPos[i*3]   = p.x; pPos[i*3+1] = p.y; pPos[i*3+2] = p.z;
    pCol[i*3]   = p.r*k; pCol[i*3+1] = p.g*k; pCol[i*3+2] = p.b*k;
    pSiz[i]     = p.size * (0.35 + 0.65*k);
  }
  pGeo.setDrawRange(0, n);
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.pcolor.needsUpdate = true;
  pGeo.attributes.psize.needsUpdate = true;
}

/* ══════════════════ МОДЕЛИ ══════════════════ */
function buildPlayer(){
  const g = new THREE.Group();

  const halo = new THREE.Mesh(
    new THREE.TorusGeometry(1.35, 0.09, 8, 64),
    new THREE.MeshBasicMaterial({color:COL_CYAN, transparent:true, opacity:0.32,
      blending:THREE.AdditiveBlending, depthWrite:false})
  );
  halo.rotation.x = -Math.PI/2;
  halo.position.y = 0.05;
  g.add(halo);

  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(0.45, 0.68, 1.15, 6),
    new THREE.MeshBasicMaterial({color:COL_CYAN})
  );
  body.position.y = 0.85;

class DiscTrail {
  constructor(color){
    this.N = 22;
    this.positions = new Float32Array(this.N*3);
    this.colors = new Float32Array(this.N*3);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.positions, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.colors, 3));
    this.geo = geo;
    this.color = new THREE.Color(color);
    this.mesh = new THREE.Line(geo, new THREE.LineBasicMaterial({
      vertexColors:true, transparent:true,
      blending:THREE.AdditiveBlending, depthWrite:false
    }));
    this.mesh.frustumCulled = false;
    this.initialized = false;
  }
  update(x,y,z){
    if (!this.initialized){
      for (let i = 0; i < this.N; i++){
        this.positions[i*3] = x; this.positions[i*3+1] = y; this.positions[i*3+2] = z;
      }
      this.initialized = true;
    }
    for (let i = this.N-1; i > 0; i--){
      this.positions[i*3]   = this.positions[(i-1)*3];
      this.positions[i*3+1] = this.positions[(i-1)*3+1];
      this.positions[i*3+2] = this.positions[(i-1)*3+2];
    }
    this.positions[0] = x; this.positions[1] = y; this.positions[2] = z;

    for (let i = 0; i < this.N; i++){
      const k = 1 - i/this.N;
      this.colors[i*3]   = this.color.r * k;
      this.colors[i*3+1] = this.color.g * k;
      this.colors[i*3+2] = this.color.b * k;
    }
    this.geo.attributes.position.needsUpdate = true;
    this.geo.attributes.color.needsUpdate = true;
  }
  dispose(){
    this.geo.dispose();
    this.mesh.material.dispose();
  }
}

function throwDisc(tx, tz){
  const p = game.player;
  if (game.state !== 'playing' || p.cd > 0) return;
  let dx = tx - p.x, dz = tz - p.z;
  const d = Math.hypot(dx, dz);
  if (d < 0.6) return;
  dx /= d; dz /= d;

  const sp = 27;
  const mesh = makeDiscMesh(COL_CYAN);
  mesh.position.set(p.x + dx, 0.7, p.z + dz);
  scene.add(mesh);

  const trail = new DiscTrail(COL_CYAN);
  scene.add(trail.mesh);

  game.discs.push({
    x:p.x + dx, z:p.z + dz, y:0.7,
    vx:dx*sp, vz:dz*sp, r:0.5,
    owner:'player', life:3.2,
    mesh, trail, spin:0
  });
  p.cd = 0.33;
  SFX.throw();
  buzz(12);
}

function spawnWave(){
  const wave = game.wave;
  const normal = 1 + Math.floor(wave/2);
  const fast = Math.floor(wave/3);
  const tank = Math.floor(wave/5);
  const list = [];
  for (let i = 0; i < normal; i++) list.push('normal');
  for (let i = 0; i < fast; i++) list.push('fast');
  for (let i = 0; i < tank; i++) list.push('tank');

  const base = Math.random()*Math.PI*2;
  const p = game.player;
  list.forEach((type, i) => {
    const cfg = ENEMY_TYPES[type];
    const a = base + (i/list.length)*Math.PI*2 + (Math.random()-0.5)*0.5;
    let x, z, tries = 0;
    do {
      const rad = ARENA_R * 0.78;
      x = Math.cos(a)*rad; z = Math.sin(a)*rad;
      tries++;
    } while (Math.hypot(x-p.x, z-p.z) < 6 && tries < 10);

    const mesh = buildEnemy(type);
    mesh.position.set(x, 0, z);
    scene.add(mesh);

    game.enemies.push({
      type, x, z, r:0.85*cfg.size,
      hp:cfg.hp, maxHp:cfg.hp,
      cd: cfg.fireCd * (0.6 + Math.random()*0.8),
      hurt:0, spin:Math.random()*6, mesh, cfg
    });
  });
}

/* ══════════════════ ОБНОВЛЕНИЕ ══════════════════ */
function update(dt){
  game.t += dt;
  game.shake *= Math.pow(0.0015, dt);
  if (game.shake < 0.05) game.shake = 0;

  updateParticles(dt);
  updateAmbient(dt);

  floorTex.offset.x += dt * 0.008;
  barrier.material.opacity = 0.04 + 0.03 * Math.sin(game.t * 2.5);
  topRing.material.opacity = 0.5 + 0.2 * Math.sin(game.t * 3);
  moonHalo.scale.setScalar(1 + Math.sin(game.t * 0.8) * 0.05);

  // вращение игрока
  if (game.state === 'playing'){
    const u = playerGroup.userData;
    u.ring2.rotation.z += dt * 1.4;
    u.ring3.rotation.z -= dt * 1.9;
    u.halo.rotation.z += dt * 0.5;
  }

  if (waveMsgTimer > 0){
    waveMsgTimer -= dt;
    if (waveMsgTimer <= 0) waveMsg.classList.remove('show');
  }

  if (game.state !== 'playing') return;

  const p = game.player;

  /* движение */
  let mvx = 0, mvz = 0;
  if (input.move.active){
    const dx = input.move.x - input.move.ox;
    const dy = input.move.y - input.move.oy;
    const d = Math.hypot(dx, dy);
    if (d > 8){
      const m = Math.min(d/70, 1);
      mvx = (dx/d)*m; mvz = (dy/d)*m;
    }
  }
  const SPD = 12.5;
  const lerp = Math.min(1, dt*14);
  p.vx += (mvx*SPD - p.vx) * lerp;
  p.vz += (mvz*SPD - p.vz) * lerp;
  p.x += p.vx * dt;
  p.z += p.vz * dt;

  const pr = Math.hypot(p.x, p.z);
  const plim = ARENA_R - 1.0;
  if (pr > plim){ p.x = p.x/pr*plim; p.z = p.z/pr*plim; }

  p.cd = Math.max(0, p.cd - dt);
  p.hurt = Math.max(0, p.hurt - dt*3);
  p.iframes = Math.max(0, p.iframes - dt);

  playerGroup.position.set(p.x, 0, p.z);

  // вспышка при попадании
  const hk = p.hurt;
  playerGroup.userData.body.material.color.setRGB(hk, 0.9 - 0.1*hk, 1);
  const scale = 1 + hk*0.3 + Math.sin(game.t*8)*0.02;
  playerGroup.scale.setScalar(scale);

  // комбо
  if (game.comboTimer > 0){
    game.comboTimer -= dt;
    if (game.comboTimer <= 0){
      game.combo = 1;
      comboLabel.classList.remove('on');
    }
  }

  /* прицел */
  if (input.aim.active){
    const w = screenToWorld(input.aim.x, input.aim.y);
    if (w){
      aimRing.visible = true;
      aimRing.position.set(w.x, 0.05, w.z);
      aimRing.rotation.z += dt * 4;
      const s = 1 + Math.sin(game.t*8)*0.12;
      aimRing.scale.setScalar(s);

      const arr = aimLineGeo.attributes.position.array;
      arr[0] = p.x; arr[1] = 0.15; arr[2] = p.z;
      arr[3] = w.x; arr[4] = 0.15; arr[5] = w.z;
      aimLineGeo.attributes.position.needsUpdate = true;
      aimLine.visible = true;
    }
  } else {
    aimRing.visible = false;
    aimLine.visible = false;
  }

  /* диски */
  for (let i = game.discs.length-1; i >= 0; i--){
    const d = game.discs[i];
    d.x += d.vx*dt;
    d.z += d.vz*dt;
    d.life -= dt;
    d.spin += dt*22;

    const dr = Math.hypot(d.x, d.z);
    const dlim = ARENA_R - d.r;
    if (dr > dlim){
      const nx = d.x/dr, nz = d.z/dr;
      d.x = nx*dlim; d.z = nz*dlim;
      const dot = d.vx*nx + d.vz*nz;
      d.vx -= 2*dot*nx;
      d.vz -= 2*dot*nz;
      spawnBurst(d.x, 0.5, d.z,
        d.owner === 'player' ? COL_CYAN : COL_RED, 6, 5);
    }

    d.mesh.position.set(d.x, d.y, d.z);
    d.mesh.rotation.y = d.spin;
    d.mesh.rotation.x = 0.35;
    d.trail.update(d.x, d.y, d.z);

    if (d.life <= 0){
      scene.remove(d.mesh);
      scene.remove(d.trail.mesh);
      d.trail.dispose();
      game.discs.splice(i, 1);
      continue;
    }

    if (d.owner === 'player'){
      let hit = false;
      for (let j = game.enemies.length-1; j >= 0; j--){
        const e = game.enemies[j];
        if (Math.hypot(d.x-e.x, d.z-e.z) < d.r + e.r){
          e.hp -= 34;
          e.hurt = 1;
          const addScore = 10 * game.combo;
          game.score += addScore;
          game.combo = Math.min(game.combo + 1, 5);
          game.comboTimer = 2.0;
          comboLabel.classList.add('on');
          comboLabel.textContent = 'COMBO ×' + game.combo;

          game.shake = Math.max(game.shake, 0.22);
          spawnBurst(d.x, 0.9, d.z, COL_CYAN, 16, 8);
          SFX.hit();
          buzz(20);
          hit = true;

          if (e.hp <= 0){
            spawnBurst(e.x, 1.0, e.z, e.cfg.color, 34, 10);
            SFX.explode();
            scene.remove(e.mesh);
            game.enemies.splice(j, 1);
            game.score += e.cfg.score * game.combo;
            game.shake = Math.max(game.shake, 0.45);
            buzz([20, 40, 30]);
          }
          break;
        }
      }
      if (hit){
        scene.remove(d.mesh);
        scene.remove(d.trail.mesh);
        d.trail.dispose();
        game.discs.splice(i, 1);
      }
    } else {
      if (p.iframes <= 0 && Math.hypot(d.x-p.x, d.z-p.z) < d.r + 0.95){
        const dmg = 12;
        p.hp -= dmg;
        p.hurt = 1;
        p.iframes = 0.35;
        game.shake = Math.max(game.shake, 0.35);
        flashHurt();
        spawnBurst(d.x, 0.8, d.z, COL_RED, 18, 8);
        SFX.hurt();
        buzz(45);
        scene.remove(d.mesh);
        scene.remove(d.trail.mesh);
        d.trail.dispose();
        game.discs.splice(i, 1);

        if (p.hp <= 0){
          p.hp = 0;
          game.shake = 1.2;
          spawnBurst(p.x, 0.8, p.z, COL_CYAN, 60, 14);
          SFX.explode();
          gameOver();
          return;
        }
      }
    }
  }

  /* враги */
  for (let i = game.enemies.length-1; i >= 0; i--){
    const e = game.enemies[i];
    e.hurt = Math.max(0, e.hurt - dt*3);
    e.cd -= dt;
    e.spin += dt*(1.2 + (e.type==='fast'?1.2:0));

    const dx = p.x - e.x, dz = p.z - e.z;
    const dist = Math.hypot(dx, dz) || 0.001;
    const nx = dx/dist, nz = dz/dist;

    let mx = 0, mz = 0;
    const near = e.type === 'fast' ? 4 : 5.5;
    const far = e.type === 'tank' ? 8 : 9;
    if (dist > far){ mx = nx; mz = nz; }
    else if (dist < near){ mx = -nx; mz = -nz; }
    else {
      const strafe = e.type === 'fast' ? 1.3 : 0.9;
      mx = -nz*strafe; mz = nx*strafe;
    }

    e.x += mx * e.cfg.speed * dt;
    e.z += mz * e.cfg.speed * dt;

    const er = Math.hypot(e.x, e.z);
    const elim = ARENA_R - 1.3;
    if (er > elim){ e.x = e.x/er*elim; e.z = e.z/er*elim; }

    e.mesh.position.set(e.x, 0, e.z);
    e.mesh.rotation.y = e.spin;

    // орбитальные осколки
    const ph = e.mesh.userData.phase;
    e.mesh.userData.shards.forEach((s, si) => {
      const a = ph + game.t*2.2 + si*Math.PI*2/3;
      const r = 1.0 * (e.type === 'tank' ? 1.35 : 1);
      s.position.set(Math.cos(a)*r, 0.9 + Math.sin(a*2)*0.15, Math.sin(a)*r);
      s.rotation.x = game.t*3 + si;
      s.rotation.y = game.t*2 + si;
    });

    // цвет при попадании
    const h = e.hurt;
    e.mesh.userData.body.material.color.setRGB(0.08 + h*0.9, 0.03 + h*0.9, 0.02 + h*0.9);

    // выстрел
    if (e.cd <= 0 && dist < 24 && game.state === 'playing'){
      const aim = Math.atan2(nz, nx) + (Math.random()-0.5)*0.22;
      const sp = e.cfg.discSpd;
      const mesh = makeDiscMesh(e.cfg.color);
      mesh.position.set(e.x + Math.cos(aim)*1.0, 0.7, e.z + Math.sin(aim)*1.0);
      scene.add(mesh);

      const trail = new DiscTrail(e.cfg.color);
      scene.add(trail.mesh);

      game.discs.push({
        x:e.x + Math.cos(aim)*1.0,
        z:e.z + Math.sin(aim)*1.0,
        y:0.7,
        vx:Math.cos(aim)*sp, vz:Math.sin(aim)*sp,
        r:0.5, owner:'enemy', life:3.4,
        mesh, trail, spin:0
      });
      e.cd = e.cfg.fireCd * (0.75 + Math.random()*0.5);
    }
  }

  /* волны */
  if (game.enemies.length === 0 && !game.betweenWaves){
    game.betweenWaves = true;
    game.waveTimer = 1.6;
  }
  if (game.betweenWaves){
    game.waveTimer -= dt;
    if (game.waveTimer <= 0){
      game.betweenWaves = false;
      game.wave++;
      spawnWave();
      showWaveMsg(game.wave);
    }
  }

  /* HUD */
  hpFill.style.width = (Math.max(0, p.hp)/p.maxHp*100) + '%';
  hpLabel.textContent = 'HP ' + Math.ceil(Math.max(0, p.hp));
  scLabel.textContent = game.score;
  waveLabel.textContent = 'WAVE ' + Math.max(1, game.wave);
}

/* ══════════════════ КАМЕРА ══════════════════ */
let camH = 40, camR = 18;

function layoutCamera(){
  const aspect = W/H;
  const VIEW_R = 16;
  const tanV = Math.tan(29 * Math.PI/180);
  const tanH = tanV * aspect;
  const need = Math.max(VIEW_R/tanH, VIEW_R/tanV);
  const elev = 68 * Math.PI/180;
  camH = need * Math.sin(elev);
  camR = need * Math.cos(elev);
}

/* ══════════════════ РЕНДЕР ══════════════════ */
let lastTime = performance.now();

function frame(now){
  requestAnimationFrame(frame);

  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.05) dt = 0.05;
  if (dt < 0) dt = 0;

  update(dt);

  if (game.state === 'menu'){
    const a = game.t * 0.22;
    const r = camR * 1.15;
    camera.position.set(Math.sin(a)*r, camH*0.95, Math.cos(a)*r);
    camera.lookAt(0, 1, 0);
  } else {
    const sh = game.shake;
    const breathe = Math.sin(game.t*0.8)*0.25;
    camera.position.set(
      (Math.random()-0.5)*sh*1.6,
      camH + breathe + (Math.random()-0.5)*sh*1.6,
      camR + (Math.random()-0.5)*sh*1.6
    );
    camera.lookAt(0, 0, 0);
  }

  composer.render();
}

/* ══════════════════ RESIZE ══════════════════ */
function layout(){
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H, false);
  composer.setSize(W, H);
  camera.aspect = W/H;
  camera.updateProjectionMatrix();
  layoutCamera();
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 150));

/* ══════════════════ BOOT ══════════════════ */
layout();
resetGame();
bestMenu.textContent = game.best > 0 ? 'BEST ' + game.best : '';
requestAnimationFrame(frame);

document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});

document.addEventListener('visibilitychange', () => {
  if (document.hidden) lastTime = performance.now();
});

</script>
